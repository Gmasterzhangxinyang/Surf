services:
  carla-server:
    image: carlasim/carla:${CARLA_VERSION:-0.9.15}
    network_mode: host
    privileged: true
    command: >
      /bin/bash -lc
      "./CarlaUE4.sh
      -RenderOffScreen
      -quality-level=Low
      -carla-rpc-port=${CARLA_PORT:-2000}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
