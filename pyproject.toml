[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasp-park"
version = "0.1.0"
description = "Decision-aware active semantic perception for parking-slot occupancy under occlusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]
openai = ["openai>=2.46"]
paper = [
  "pypdf>=4.0",
  "reportlab>=4.0",
]
dev = [
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "pypdf>=4.0",
  "pytest>=8.0",
  "reportlab>=4.0",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "parking_pose_correction*",
  "parking_slot_agent_v2*",
  "parking_slot_box_scoring*",
  "parking_slot_hybrid_3d*",
  "parking_slot_part2*",
  "parking_slot_validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "parking_slot_agent_v2/tests"]
addopts = "-ra"
