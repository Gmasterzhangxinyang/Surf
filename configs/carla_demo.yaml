output_dir: outputs/carla_demo

carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 10.0
  map: Town05
  fixed_delta_seconds: 0.05
  warmup_frames: 10

  ego_blueprint: vehicle.tesla.model3
  ego_spawn:
    location: {x: -55.0, y: 24.0, z: 0.5}
    rotation: {pitch: 0.0, yaw: 0.0, roll: 0.0}

  lidar:
    transform:
      location: {x: 0.0, y: 0.0, z: 2.2}
      rotation: {pitch: 0.0, yaw: 0.0, roll: 0.0}
    attributes:
      range: 45.0
      channels: 64
      points_per_second: 120000
      rotation_frequency: 20
      upper_fov: 10.0
      lower_fov: -25.0

  camera:
    enabled: false
    transform:
      location: {x: 1.2, y: 0.0, z: 1.8}
      rotation: {pitch: -5.0, yaw: 0.0, roll: 0.0}
    attributes:
      image_size_x: 1280
      image_size_y: 720
      fov: 90

  parked_vehicles:
    - blueprint: vehicle.audi.tt
      transform:
        location: {x: -44.0, y: 16.5, z: 0.5}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}
    - blueprint: vehicle.mercedes.coupe
      transform:
        location: {x: -32.8, y: 16.4, z: 0.5}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}
    - blueprint: vehicle.mini.cooper_s
      transform:
        location: {x: -20.8, y: 16.2, z: 0.5}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}
    - blueprint: vehicle.lincoln.mkz_2020
      transform:
        location: {x: -35.0, y: 31.0, z: 0.5}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}
    - blueprint: vehicle.jeep.wrangler_rubicon
      transform:
        location: {x: -27.0, y: 23.9, z: 0.5}
        rotation: {pitch: 0.0, yaw: 0.0, roll: 0.0}
    - blueprint: vehicle.ford.mustang
      transform:
        location: {x: -26.8, y: 31.8, z: 0.5}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}

  static_obstacles:
    # Small/low objects make the parking belief harder: they may create sparse
    # obstacle-height returns and should trigger cautious active perception.
    - blueprint: static.prop.trafficcone01
      blueprint_filter: static.prop.*
      transform:
        location: {x: -38.6, y: 16.8, z: 0.05}
        rotation: {pitch: 0.0, yaw: 0.0, roll: 0.0}
    - blueprint: static.prop.trafficcone01
      blueprint_filter: static.prop.*
      transform:
        location: {x: -39.4, y: 17.2, z: 0.05}
        rotation: {pitch: 0.0, yaw: 0.0, roll: 0.0}
    - blueprint: static.prop.box01
      blueprint_filter: static.prop.*
      transform:
        location: {x: -32.5, y: 31.2, z: 0.15}
        rotation: {pitch: 0.0, yaw: 20.0, roll: 0.0}
    - blueprint: static.prop.streetbarrier
      blueprint_filter: static.prop.*
      transform:
        location: {x: -24.0, y: 24.0, z: 0.05}
        rotation: {pitch: 0.0, yaw: 90.0, roll: 0.0}

grid:
  x_min: 0.0
  x_max: 40.0
  y_min: -20.0
  y_max: 20.0
  resolution: 0.25

