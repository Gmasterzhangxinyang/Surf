agent:
  top_k_regions: 3
  max_rounds: 1
  max_competitor_explorations: 2
  final_decision:
    min_top1_stable_rounds: 2
    min_score_margin: 0.08
    max_occupied_ratio: 0.05
    max_unknown_ratio: 0.30
    max_occlusion_mean: 0.25
    max_entrance_unknown: 0.30
    max_entrance_occupied: 0.02
  weights:
    uncertainty: 0.35
    occlusion: 0.30
    decision_impact: 0.25
    obstacle_boundary: 0.10

visualization:
  dpi: 160
